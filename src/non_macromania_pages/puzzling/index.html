<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./index.css">
    <style>
        #soundToggle {
            z-index: 4;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        /* button from https://codepen.io/pen?editors=1010 */

        .pp-neon {
            position: relative;
            display: inline-grid;
            grid-template-columns: auto auto;
            align-items: center;
            gap: 10px;
            padding: 10px 22px 10px 16px;
            background: #00000000;
            border: 1px solid rgba(140, 141, 140, 0.4);
            border-radius: 8px;
            color: #f0f1f0;
            cursor: pointer;
            text-shadow: 0 0 8px rgba(140, 141, 140, 0.6);
            box-shadow:
                inset 0 0 12px rgba(140, 141, 140, 0.1),
                0 0 14px rgba(140, 141, 140, 0.25);
            transition:
                box-shadow 0.25s,
                border-color 0.2s,
                transform 0.15s;
        }

        .pp-neon:hover {
            border-color: #f0f1f0;
            box-shadow:
                inset 0 0 18px rgba(140, 141, 140, 0.2),
                0 0 22px rgba(140, 141, 140, 0.5);
            transform: translateY(-1px);
        }

        .pp-neon:focus-visible {
            outline: 3px solid rgba(140, 141, 140, 0.5);
            outline-offset: 3px;
        }

        .pp-neon-ring {
            position: relative;
            display: grid;
            place-items: center;
            width: 26px;
            height: 26px;
            border: 1.5px solid #f0f1f0;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(140, 141, 140, 0.4);
        }

        .pp-neon[aria-pressed="true"] .pp-neon-ring {
            animation: ppNeonPulse 1.4s ease-in-out infinite;
        }

        @keyframes ppNeonPulse {

            0%,
            100% {
                box-shadow: 0 0 10px rgba(140, 141, 140, 0.4);
            }

            50% {
                box-shadow: 0 0 22px rgba(140, 141, 140, 0.85);
            }
        }

        .pp-neon-ring svg {
            display: block;
        }

        .pp-neon-label {
            position: relative;
            display: inline-block;
            font-size: clamp(0.4rem, 1.5vw, 1.2rem);
            letter-spacing: 0.2em;
            /* Reserve width of the longer label (PAUSE) so the button
     doesn't reflow when the state flips. */
            min-width: 7ch;
            text-align: left;
        }

        .pp-neon-text {
            display: none;
        }

        .pp-neon[aria-pressed="false"] .pp-neon-text-play {
            display: inline;
        }

        .pp-neon[aria-pressed="true"] .pp-neon-text-pause {
            display: inline;
        }

        .pp-neon-icon {
            transition: d 0.3s cubic-bezier(0.5, 0, 0.3, 1.2);
        }

        .pp-neon[aria-pressed="true"] .pp-neon-icon {
            d: path("M7 5 H10 V19 H7 Z M14 5 H17 V19 H14 Z");
        }

        @media (prefers-reduced-motion: reduce) {

            .pp-neon,
            .pp-neon * {
                animation: none !important;
            }
        }
    </style>
</head>

<body>
    <canvas id="glCanvas"></canvas>
    <div id="cover"></div>
    <div id="messages">
        <!-- Loading spinner from https://loading.io/css/ -->
        <div class="lds-default">

            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>
    <script src="./progression.js"></script>

    <button id="soundToggle" onclick="toggleMusic()" class="pp-neon" type="button" aria-pressed="false"
        aria-label="Toggle Sound" data-pp>
        <span class="pp-neon-ring" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                <path class="pp-neon-icon" d="M8 5 L8 19 L19 12 Z" fill="currentColor" />
            </svg>
        </span>
        <span class="pp-neon-label" aria-hidden="true">
            <span class="pp-neon-text pp-neon-text-play">Sound</span>
            <span class="pp-neon-text pp-neon-text-pause">Mute</span>
        </span>
    </button>
